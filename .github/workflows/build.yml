name: Build TurboVPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SDK packages
        run: |
          # GitHub runners ship an Android SDK preinstalled; the setup-android action
          # itself fails trying to install the obsolete 'tools' package, so skip it.
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null | grep -E "android-36|build-tools;36" || true

      - name: Restore native libs from the latest official release APK
        run: |
          # Always pull the newest official release so the native libraries
          # (.so) match what the upstream app currently ships - no manual
          # version bump needed when a new release comes out.
          LATEST=$(curl -s https://api.github.com/repos/mlmvpn/mlmvpn_android/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          echo "Latest upstream release: $LATEST"
          wget -q "https://github.com/mlmvpn/mlmvpn_android/releases/download/${LATEST}/mlmvpn-${LATEST#v}-arm64-v8a-release.apk" -O official-arm64.apk
          wget -q "https://github.com/mlmvpn/mlmvpn_android/releases/download/${LATEST}/mlmvpn-${LATEST#v}-armeabi-v7a-release.apk" -O official-armv7.apk
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          unzip -o -q official-arm64.apk 'lib/arm64-v8a/*' -d extract64
          unzip -o -q official-armv7.apk 'lib/armeabi-v7a/*' -d extract32
          cp extract64/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp extract32/lib/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/
          ls -la app/src/main/jniLibs/arm64-v8a | head -20

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PmlmQuick

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboVPN-APK
          path: app/build/outputs/apk/debug/*.apk
